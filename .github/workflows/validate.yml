name: Validate dispatch packets

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate example packet
        run: python scripts/validate_dispatch.py examples/dispatch.valid.md
